[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mariyaodev-featplat_jd035"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出特征平台工程师·结构化输出的约束解码上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mariyaodev" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mariyaodev.github.io"
Repository = "https://github.com/mariyaodev/featplat_jd035"
Issues = "https://github.com/mariyaodev/featplat_jd035/issues"

[project.scripts]
featplat_jd035 = "featplat_jd035:main"

[tool.setuptools]
py-modules = ["featplat_jd035"]
